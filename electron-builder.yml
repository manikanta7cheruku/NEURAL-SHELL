# =============================================================================
# PROJECT SEVEN — electron-builder configuration
# Version: 2.4 — disable finish run, fix install path
# =============================================================================

appId: com.sevenlabs.seven
productName: SEVEN
copyright: "Copyright © 2025 Seven Labs. All rights reserved."

# Disable asar packing - prevents file lock issues during builds
# Files go directly into resources/app/ folder instead of app.asar
# This also makes debugging easier in production
asar: false

directories:
  output: dist-electron
  buildResources: electron

# ── Files packed into asar ──
files:
  - electron/**/*
  - frontend/dist/**/*
  - "!**/*.pyc"
  - "!**/__pycache__"
  - "!.git"
  - "!node_modules"
  - "!venv"
  - "!dist-electron"
  - "!python-dist"
  - "!installer"

# ── Extra resources ──
extraResources:
  - from: "."
    to: "app"
    filter:
      - "*.py"
      - "*.txt"
      - "*.json"
      - "requirements.txt"
      - "backend/**/*"
      - "brain_modules/**/*"
      - "ears/**/*"
      - "hands/**/*"
      - "knowledge/**/*"
      - "main_modules/**/*"
      - "memory/**/*"
      - "mouth/**/*"
      - "seven_overlay/**/*"
      - "task_panel/**/*"
      - "web/**/*"
      - "chrome_extension/**/*"
      - "!**/*.pyc"
      - "!**/__pycache__/**"
      - "!node_modules/**"
      - "!venv/**"
      - "!dist-electron/**"
      - "!python-dist/**"
      - "!frontend/**"
      - "!installer/**"
      - "!**/*.wav"
      - "!**/*.mp3"
      - "!test_*.py"
      - "!check_*.py"
      - "!scan_*.py"
      - "!scan_catches.py"
      - "!scan_backend.py"
      - "!baseline_*.txt"
      - "!dev*.bat"
      - "!dev-keep.bat"
  - from: "python-dist/python"
    to: "app/python"
    filter:
      - "**/*"

# ── Windows — x64 only ──
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.ico
  requestedExecutionLevel: asInvoker

# ── Disable signing ──
forceCodeSigning: false

# ── NSIS ──
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SEVEN
  perMachine: false
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: false

# win-unpacked is cleaned automatically by npm run clean before next build