# =============================================================================
# PROJECT SEVEN — electron-builder configuration
# Version: 2.4 — disable finish run, fix install path
# =============================================================================

appId: com.sevenlabs.seven
productName: SEVEN
executableName: SEVEN
copyright: "Copyright © 2025 Seven Labs. All rights reserved."

# Disable asar packing - prevents file lock issues during builds
# Files go directly into resources/app/ folder instead of app.asar
# This also makes debugging easier in production
asar: false

directories:
  output: dist-electron
  buildResources: electron

# Balance compression size and extraction speed to prevent installer freezing
compression: normal

# ── Files packed into asar ──
files:
  - electron/**/*
  - frontend/dist/**/*
  - "!**/*.pyc"
  - "!**/__pycache__"
  - "!.git"
  - "!node_modules"
  - "!venv"
  - "!dist-electron"
  - "!python-dist"
  - "!installer"

# ── Extra resources ──
extraResources:
  - from: "."
    to: "app"
    filter:
      # Root files are listed one by one. A wildcard here once shipped the
      # internal licence tool, scratch scripts and log files to users.
      - "main.py"
      - "brain.py"
      - "brain_manager.py"
      - "config.py"
      - "config.json"
      - "license.py"
      - "reminder_fire.py"
      - "schedule_daemon.py"
      - "server_sync.py"
      - "seven_paths.py"
      - "telemetry.py"
      - "trigger_daemon.py"
      - "voice_limits.py"
      - "version.txt"
      - "requirements.txt"
      - "LICENSE.txt"
      - "backend/**/*"
      - "brain_modules/**/*"
      - "companion/**/*"
      - "ears/**/*"
      - "hands/**/*"
      - "knowledge/**/*"
      - "main_modules/**/*"
      - "memory/**/*"
      - "mouth/**/*"
      - "seven_overlay/**/*"
      - "task_panel/**/*"
      - "trigger_modules/**/*"
      - "seven_utils/**/*"
      - "web/**/*"
      - "chrome_extension/**/*"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/__pycache__/**"
      - "!node_modules/**"
      - "!venv/**"
      - "!dist-electron/**"
      - "!python-dist/**"
      - "!frontend/**"
      - "!installer/**"
      - "!**/*.wav"
      - "!**/*.mp3"
      - "!test_*.py"
      - "!check_*.py"
      - "!scan_*.py"
      - "!scan_catches.py"
      - "!scan_backend.py"
      - "!baseline_*.txt"
      - "!dev*.bat"
      - "!dev-keep.bat"
  - from: "python-dist/python"
    to: "app/python"
    filter:
      - "**/*"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/*.pdb"
      - "!**/*.a"
      - "!**/*.lib"
      - "!**/__pycache__/**"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/testing/**"
      # Windows paths stop at 260 characters. torch's nested third-party licence folders and its C++
      # headers (only used to compile extensions) went past that and broke the installer.
      - "!**/*.dist-info/licenses/third_party/**"
      - "!Lib/site-packages/torch/include/**"

# ── Windows — x64 only ──
win:
  target:
    - target: dir
      arch:
        - x64
  icon: electron/icon.ico
  requestedExecutionLevel: asInvoker

# ── Disable signing ──
forceCodeSigning: false

# ── NSIS ──
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SEVEN
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
  installerSidebar: electron/icon.png
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  displayLanguageSelector: false
  include: electron/installer.nsh
  license: null
  warningsAsErrors: false
  # Detailed file list during install (pairs with ShowInstDetails in installer.nsh)
  # Progress bar still driven by NSIS sections; details prevent "frozen" feel
  differentialPackage: false

# win-unpacked is cleaned automatically by npm run clean before next build