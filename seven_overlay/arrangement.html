<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<!--
  seven_overlay/arrangement.html
  The arrangement card, shown at the top centre after a workspace opens. The window is Windows' own glass (see
  electron/overlay_daemon.js), so this page draws only the content, and reports its size so the window always fits it.

  1. Pick a layout (click, or press 1-6).
  2. Seven fills the zones with the workspace's windows in order. Click a window to put it in the next free zone, drag
     it onto a zone, or click a zone to empty it. Apply (or Enter) arranges them.
  It closes on Esc, the close button, or a click anywhere else on the screen.
  The daemon calls window.__applyArrangementData({windows: [{hwnd, title, exe}], allWindows: [...]}).
-->
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --text: #f3f1ec; --muted: rgba(243, 241, 236, 0.62); --dim: rgba(243, 241, 236, 0.42);
    --faint: rgba(243, 241, 236, 0.07); --line: rgba(243, 241, 236, 0.12);
    --lagoon: #4fd6c2; --lagoon-soft: rgba(79, 214, 194, 0.16); --lagoon-line: rgba(79, 214, 194, 0.55);
  }
  html, body { background: transparent; overflow: hidden; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }

  #card { width: 392px; padding: 14px 16px 16px; }
  #card.leaving { opacity: 0; transform: translateY(-4px); transition: opacity 140ms ease, transform 140ms ease; }

  .head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .head-text { flex: 1; min-width: 0; }
  .title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .hint { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 26px; height: 26px; border-radius: 7px; border: 0; background: transparent; color: var(--dim);
              display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: background 150ms, color 150ms; }
  .icon-btn:hover { background: var(--faint); color: var(--text); }
  .icon-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .phase { display: none; }
  .phase.active { display: block; animation: phase-in 220ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes phase-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Layout picker */
  .layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .layout { position: relative; height: 78px; border-radius: 10px; background: var(--faint); border: 1px solid transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms cubic-bezier(0.22, 1, 0.36, 1); }
  .layout:hover { background: var(--lagoon-soft); border-color: var(--lagoon-line); transform: translateY(-1px); }
  .layout:active { transform: scale(0.97); }
  .layout svg { width: 52px; height: 32px; }
  .zone-shape { fill: rgba(243, 241, 236, 0.2); transition: fill 160ms ease; }
  .layout:hover .zone-shape { fill: rgba(79, 214, 194, 0.75); }
  .layout-name { font-size: 11.5px; font-weight: 500; color: var(--muted); transition: color 160ms; }
  .layout:hover .layout-name { color: var(--text); }
  .key { position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* Assignment */
  .bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .back { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px 0 6px; border: 0; border-radius: 7px;
          background: transparent; color: var(--muted); font: 500 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; cursor: pointer;
          transition: background 150ms, color 150ms; }
  .back:hover { background: var(--faint); color: var(--text); }
  .back svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bar-note { margin-left: auto; font-size: 11.5px; color: var(--dim); }

  .preview { display: grid; gap: 6px; height: 118px; padding: 6px; border-radius: 10px; background: rgba(0, 0, 0, 0.18); }
  .zone { min-width: 0; border-radius: 7px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
          gap: 6px; padding: 0 8px; font-size: 11.5px; color: var(--dim); cursor: pointer; overflow: hidden;
          transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
  .zone .n { flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
             font-size: 10px; font-weight: 600; background: var(--faint); color: var(--muted); }
  .zone .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone.filled { border: 1px solid var(--lagoon-line); background: var(--lagoon-soft); color: var(--text); }
  .zone.filled .n { background: var(--lagoon); color: #062420; }
  .zone.over { border-color: var(--lagoon); background: rgba(79, 214, 194, 0.24); }
  .zone.filled:hover .label::after { content: '  ·  clear'; color: var(--muted); }

  .pool-label { margin: 12px 2px 6px; font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: 0.02em; }
  .pool { display: flex; flex-wrap: wrap; gap: 6px; max-height: 64px; overflow-y: auto; }
  .pool::-webkit-scrollbar { width: 3px; }
  .pool::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 170px; height: 26px; padding: 0 10px; border-radius: 13px;
          background: var(--faint); font-size: 11.5px; color: var(--text); cursor: grab; white-space: nowrap;
          transition: background 150ms ease, opacity 150ms ease; }
  .chip span { overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { background: rgba(243, 241, 236, 0.13); }
  .chip.used { opacity: 0.45; }
  .chip.dragging { opacity: 0.3; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .chip.used i { background: var(--lagoon); }

  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .status { font-size: 11.5px; color: var(--muted); }
  .apply { height: 30px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--lagoon); color: #062420;
           font: 600 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif; cursor: pointer; transition: background 150ms, opacity 150ms, transform 120ms; }
  .apply:hover:not(:disabled) { background: #6ae0ce; }
  .apply:active:not(:disabled) { transform: scale(0.97); }
  .apply:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>

<div id="card">
  <div class="head">
    <div class="head-text">
      <div class="title" id="title">Arrange windows</div>
      <div class="hint" id="hint">Pick a layout for the windows you just opened</div>
    </div>
    <button class="icon-btn" onclick="retract()" title="Close (Esc)">
      <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
    </button>
  </div>

  <div class="phase active" id="phase1">
    <div class="layouts" id="layouts"></div>
  </div>

  <div class="phase" id="phase2">
    <div class="bar">
      <button class="back" onclick="toPicker()">
        <svg viewBox="0 0 12 12"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg>Layouts
      </button>
      <span class="bar-note" id="barNote"></span>
    </div>
    <div class="preview" id="preview"></div>
    <div class="pool-label">Windows</div>
    <div class="pool" id="pool"></div>
    <div class="foot">
      <span class="status" id="status"></span>
      <button class="apply" id="applyBtn" onclick="apply()" disabled>Apply</button>
    </div>
  </div>
</div>

<script>
  // grid: rows of zone numbers; a number repeated across cells spans them. shapes: the picker thumbnail (52x32).
  const LAYOUTS = [
    { id: 'maximize',         name: 'Full screen',    grid: [[1]],           labels: ['Full screen'],
      note: 'Maximizes every window, or only the one you place', shapes: [[1, 1, 50, 30]] },
    { id: 'split_vertical',   name: 'Side by side',   grid: [[1, 2]],        labels: ['Left', 'Right'],
      shapes: [[1, 1, 24, 30], [27, 1, 24, 30]] },
    { id: 'split_horizontal', name: 'Top and bottom', grid: [[1], [2]],      labels: ['Top', 'Bottom'],
      shapes: [[1, 1, 50, 14], [1, 17, 50, 14]] },
    { id: 'grid',             name: 'Four corners',   grid: [[1, 2], [3, 4]], labels: ['Top left', 'Top right', 'Bottom left', 'Bottom right'],
      shapes: [[1, 1, 24, 14], [27, 1, 24, 14], [1, 17, 24, 14], [27, 17, 24, 14]] },
    { id: 'main_two',         name: 'Main and two',   grid: [[1, 2], [1, 3]], labels: ['Main', 'Top right', 'Bottom right'],
      shapes: [[1, 1, 30, 30], [33, 1, 18, 14], [33, 17, 18, 14]] },
    { id: 'minimize_others',  name: 'Focus one',      grid: [[1]],           labels: ['Keep open'],
      note: 'Keeps one window open and minimizes the rest', shapes: [[10, 4, 32, 24]] },
  ];

  let _windows = [], _all = [], _layout = null, _assign = {}, _leaving = false;

  function fit() {
    const r = document.getElementById('card').getBoundingClientRect();
    window.electronAPI && window.electronAPI.fit && window.electronAPI.fit(392, r.height);
    return { w: 392, h: r.height };
  }

  function cleanTitle(t) {
    if (!t) return 'Window';
    const parts = t.trim().split(/\s+[-–—|]\s+/);
    const title = parts.length > 1 ? parts[parts.length - 1] : parts[0];   // "Report - Word" reads as "Word"
    return title.length > 28 ? title.slice(0, 26) + '…' : title;
  }

  function pool() {
    const seen = new Set();
    return [..._windows, ..._all].filter(w => !seen.has(w.hwnd) && seen.add(w.hwnd));
  }

  function buildPicker() {
    const box = document.getElementById('layouts');
    box.innerHTML = '';
    LAYOUTS.forEach((l, i) => {
      const el = document.createElement('div');
      el.className = 'layout';
      el.innerHTML = `<span class="key">${i + 1}</span><svg viewBox="0 0 52 32">${
        l.shapes.map(([x, y, w, h]) => `<rect class="zone-shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5"/>`).join('')
      }</svg><span class="layout-name">${l.name}</span>`;
      el.onclick = () => pick(l.id);
      box.appendChild(el);
    });
  }

  function applyData(data) {
    _windows = data.windows || [];
    _all     = data.allWindows || [];
    _leaving = false;
    document.getElementById('card').classList.remove('leaving');
    const names = [...new Set(_windows.map(w => cleanTitle(w.title || w.exe)))];
    document.getElementById('hint').textContent = names.length
      ? `${names.slice(0, 3).join(', ')}${names.length > 3 ? ` and ${names.length - 3} more` : ''}`
      : 'Pick a layout for your open windows';
    toPicker(true);
    return fit();
  }
  window.__applyArrangementData = applyData;

  function toPicker(silent) {
    _layout = null; _assign = {};
    document.getElementById('title').textContent = 'Arrange windows';
    document.getElementById('phase2').classList.remove('active');
    document.getElementById('phase1').classList.add('active');
    if (!silent) fit();
  }

  function pick(id) {
    _layout = LAYOUTS.find(l => l.id === id);
    _assign = {};
    document.getElementById('title').textContent = _layout.name;
    document.getElementById('barNote').textContent = _layout.note || 'Click a window to place it';
    document.getElementById('phase1').classList.remove('active');
    document.getElementById('phase2').classList.add('active');
    buildZones();
    buildPool();
    if (id !== 'maximize') _windows.slice(0, zoneCount()).forEach((w, i) => place(i, w.hwnd));
    update();
    fit();
  }

  function zoneCount() { return Math.max(..._layout.grid.flat()); }

  function buildZones() {
    const box = document.getElementById('preview');
    box.innerHTML = '';
    const g = _layout.grid, rows = g.length, cols = Math.max(...g.map(r => r.length));
    box.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    box.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    const done = new Set();
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const n = g[r][c];
      if (done.has(n)) continue;
      done.add(n);
      let rs = 1, cs = 1;
      while (g[r + rs] && g[r + rs][c] === n) rs++;
      while (g[r][c + cs] === n) cs++;
      const z = document.createElement('div');
      z.className = 'zone';
      z.dataset.i = n - 1;
      z.style.gridRow = `${r + 1} / span ${rs}`;
      z.style.gridColumn = `${c + 1} / span ${cs}`;
      z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', e => {
        e.preventDefault(); z.classList.remove('over');
        const h = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (h) { place(n - 1, h); update(); }
      });
      z.addEventListener('click', () => { if (_assign[n - 1] != null) { delete _assign[n - 1]; update(); } });
      box.appendChild(z);
    }
  }

  function buildPool() {
    const box = document.getElementById('pool');
    box.innerHTML = '';
    pool().forEach(w => {
      const c = document.createElement('div');
      c.className = 'chip';
      c.draggable = true;
      c.dataset.h = w.hwnd;
      c.title = w.title || w.exe || '';
      c.innerHTML = `<i></i><span>${cleanTitle(w.title || w.exe).replace(/</g, '&lt;')}</span>`;
      c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', String(w.hwnd)); c.classList.add('dragging'); });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
      c.addEventListener('click', () => {
        const at = Object.keys(_assign).find(k => _assign[k] === w.hwnd);
        if (at != null) { delete _assign[at]; update(); return; }          // a placed window: take it out again
        for (let i = 0; i < zoneCount(); i++) if (_assign[i] == null) { place(i, w.hwnd); break; }
        update();
      });
      box.appendChild(c);
    });
  }

  function place(i, hwnd) {
    for (const k of Object.keys(_assign)) if (_assign[k] === hwnd) delete _assign[k];    // one window, one zone
    _assign[i] = hwnd;
  }

  function update() {
    const byH = Object.fromEntries(pool().map(w => [w.hwnd, w]));
    document.querySelectorAll('.zone').forEach(z => {
      const i = Number(z.dataset.i), h = _assign[i];
      z.classList.toggle('filled', h != null);
      const text = h != null ? cleanTitle(byH[h] ? (byH[h].title || byH[h].exe) : 'Window') : _layout.labels[i];
      z.innerHTML = `<span class="n">${i + 1}</span><span class="label">${String(text).replace(/</g, '&lt;')}</span>`;
    });
    const used = new Set(Object.values(_assign));
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', used.has(Number(c.dataset.h))));
    const n = Object.keys(_assign).length, total = zoneCount();
    const btn = document.getElementById('applyBtn');
    const status = document.getElementById('status');
    if (_layout.id === 'maximize') {
      status.textContent = n ? 'Only this window goes full screen' : `All ${pool().length} windows go full screen`;
      btn.disabled = false;
    } else {
      status.textContent = `${n} of ${total} placed`;
      btn.disabled = n === 0;
    }
  }

  function apply() {
    if (!_layout) return;
    const all = pool().map(w => w.hwnd);
    let list = [];
    for (let i = 0; i < zoneCount(); i++) if (_assign[i] != null) list.push(_assign[i]);
    if (_layout.id === 'maximize' && !list.length) list = all;
    if (!list.length) return;
    const keep = new Set(list.map(Number));
    const payload = {
      layout: _layout.id, hwnd_list: list,
      minimize_hwnds: _layout.id === 'minimize_others' ? all.filter(h => !keep.has(Number(h))) : [],
    };
    try { window.electronAPI && window.electronAPI.applyLayout(payload); } catch (e) {}
    retract();
  }

  function retract() {
    if (_leaving) return;
    _leaving = true;
    document.getElementById('card').classList.add('leaving');
    window.electronAPI && window.electronAPI.close();            // the daemon glides the glass out
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return retract();
    if (!_layout && /^[1-6]$/.test(e.key)) return pick(LAYOUTS[Number(e.key) - 1].id);
    if (_layout && e.key === 'Enter' && !document.getElementById('applyBtn').disabled) return apply();
    if (_layout && e.key === 'Backspace') return toPicker();
  });

  buildPicker();
</script>
</body>
</html>
