<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<!--
  seven_overlay/schedule_notification.html
  The reminder card, bottom right above the taskbar. Like the status card, the window is Windows' own glass, so this
  page draws only the content. It stays until you choose Done or Snooze; both work whether Seven is open or closed
  (electron/overlay_daemon.js, snoozeReminder).
  The daemon calls window.__applyScheduleData({type, message}) and sizes the window to the height it returns.
-->
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --text: #f3f1ec; --muted: rgba(243, 241, 236, 0.62); --faint: rgba(243, 241, 236, 0.09);
    --lagoon: #4fd6c2; --brass: #e9bd6a;
  }
  html, body { background: transparent; overflow: hidden; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }

  #card { width: 340px; padding: 16px 16px 14px 18px; }

  .head { display: flex; align-items: center; gap: 10px; }
  .badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
           background: rgba(233, 189, 106, 0.16); color: var(--brass); }
  .badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .badge.ring { animation: ring 1.1s 200ms cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  @keyframes ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(14deg); } 30% { transform: rotate(-12deg); }
                    45% { transform: rotate(8deg); } 60% { transform: rotate(-5deg); } 75% { transform: rotate(2deg); } }
  .kind { flex: 1; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
  .time { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .message { margin: 10px 0 14px; font-size: 14.5px; font-weight: 500; line-height: 1.45; color: var(--text);
             overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  button { height: 30px; padding: 0 14px; border-radius: 8px; border: 0; font: 600 12px 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
           cursor: pointer; transition: background 160ms ease, color 160ms ease, transform 120ms ease; }
  button:active { transform: scale(0.97); }
  .ghost { background: var(--faint); color: var(--text); }
  .ghost:hover { background: rgba(243, 241, 236, 0.15); }
  .primary { background: var(--lagoon); color: #062420; }
  .primary:hover { background: #6ae0ce; }
  button:focus-visible { outline: 2px solid rgba(79, 214, 194, 0.6); outline-offset: 2px; }

  .enter { animation: enter 320ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="card">
  <div class="head">
    <span class="badge" id="badge">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </span>
    <span class="kind" id="kind">Reminder</span>
    <span class="time" id="time"></span>
  </div>
  <div class="message" id="message"></div>
  <div class="actions">
    <button class="ghost" id="snooze" onclick="snooze()">Snooze 10 min</button>
    <button class="primary" id="done" onclick="done()">Done</button>
  </div>
</div>

<script>
  const KINDS = { alarm: 'Alarm', reminder: 'Reminder', timer: 'Timer', event: 'Event' };
  let _data = {};

  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t = ctx.currentTime;
      [[587.33, 0, 0.5, 0.05], [880, 0.14, 0.7, 0.04]].forEach(([f, s, d, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + s);
        g.gain.exponentialRampToValueAtTime(v, t + s + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
        o.connect(g); g.connect(ctx.destination); o.start(t + s); o.stop(t + s + d + 0.05);
      });
    } catch (e) {}
  }

  function applyData(data) {
    _data = data || {};
    document.getElementById('kind').textContent = KINDS[_data.type] || 'Reminder';
    document.getElementById('message').textContent = _data.message || 'Reminder';
    document.getElementById('time').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    const card = document.getElementById('card');
    card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
    const badge = document.getElementById('badge');
    badge.classList.remove('ring'); void badge.offsetWidth; badge.classList.add('ring');
    chime();
    const r = card.getBoundingClientRect();
    return { w: 340, h: r.height };
  }
  window.__applyScheduleData = applyData;

  // Seven, if it is open, also shows this reminder in its window; clear that too.
  function clearInApp() {
    fetch('http://127.0.0.1:7777/api/schedule/alert/dismiss', { method: 'POST' }).catch(() => {});
  }

  function done() {
    clearInApp();
    window.electronAPI && window.electronAPI.close();
  }

  function snooze() {
    clearInApp();
    // Snooze the reminder itself ("original"), not the sentence Seven spoke for it, or it returns wrapped in itself.
    window.electronAPI && window.electronAPI.snooze({ message: _data.original || _data.message || 'Reminder', type: _data.type || 'reminder', minutes: 10 });
    window.electronAPI && window.electronAPI.close();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') done(); });
</script>
</body>
</html>
