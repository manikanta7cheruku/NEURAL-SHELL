<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 380px;
    height: 82px;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(14, 14, 18, 0.92);
    border-radius: 0 0 16px 16px;
    border-left:   1px solid rgba(255, 255, 255, 0.08);
    border-right:  1px solid rgba(255, 255, 255, 0.08);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    backdrop-filter: blur(32px) saturate(120%);
    -webkit-backdrop-filter: blur(32px) saturate(120%);
    transform: translateY(-100%);
    opacity: 0;
    will-change: transform, opacity;
    cursor: pointer;
    user-select: none;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
    pointer-events: none;
    border-radius: 0 0 16px 16px;
  }

  .card::after {
    content: '';
    position: absolute;
    left: 20%; right: 20%;
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
    pointer-events: none;
  }

  .card.show {
    animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .card.hiding {
    animation: slideUp 0.35s cubic-bezier(0.55, 0, 0.85, 0.35) forwards;
  }

  @keyframes slideDown {
    0%   { transform: translateY(-100%); opacity: 0; }
    100% { transform: translateY(0);     opacity: 1; }
  }
  @keyframes slideUp {
    0%   { transform: translateY(0);     opacity: 1; }
    100% { transform: translateY(-100%); opacity: 0; }
  }

  .accent-bar {
    width: 3px;
    height: 34px;
    background: linear-gradient(180deg,
      rgba(200, 180, 255, 0.9) 0%,
      rgba(140, 110, 240, 0.8) 50%,
      rgba(110, 80, 220, 0.7) 100%);
    border-radius: 3px;
    margin-right: 14px;
    flex-shrink: 0;
    box-shadow:
      0 0 8px rgba(160, 130, 255, 0.6),
      0 0 20px rgba(150, 120, 255, 0.25);
    position: relative;
    z-index: 2;
  }

  .text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    position: relative;
    z-index: 2;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    letter-spacing: -0.01em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .subtitle-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.6);
    font-weight: 400;
    letter-spacing: -0.005em;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dot {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }

  .detail {
    color: rgba(200, 180, 255, 0.8);
    font-weight: 500;
    letter-spacing: -0.005em;
    font-size: 10.5px;
  }
</style>
</head>
<body>

<div class="card" id="card" onclick="retract()">
  <div class="accent-bar"></div>
  <div class="text">
    <div class="title" id="titleEl">Seven</div>
    <div class="subtitle-row">
      <span class="subtitle" id="subtitleEl"></span>
      <span class="dot" id="dotEl" style="display:none"></span>
      <span class="detail" id="detailEl" style="display:none"></span>
    </div>
  </div>
</div>

<script>
  let _timer = null;

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      function tone(freq, start, dur, vol) {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur);
      }
      tone(523.25, now,        0.22, 0.12);
      tone(659.25, now + 0.12, 0.28, 0.10);
    } catch(e) {}
  }

  function applyData(data) {
    const { title = 'Seven', subtitle = '', detail = '', holdMs = 4500 } = data;

    if (_timer) { clearTimeout(_timer); _timer = null; }

    document.getElementById('titleEl').textContent = title;
    document.getElementById('subtitleEl').textContent = subtitle;

    const detEl = document.getElementById('detailEl');
    const dotEl = document.getElementById('dotEl');
    if (detail) {
      detEl.textContent = detail;
      detEl.style.display = '';
      if (subtitle) dotEl.style.display = '';
    } else {
      detEl.style.display = 'none';
      dotEl.style.display = 'none';
    }

    const card = document.getElementById('card');
    card.classList.remove('show', 'hiding');
    void card.offsetWidth;
    card.classList.add('show');

    playChime();

    _timer = setTimeout(retract, holdMs);
  }

  window.__applyNotifData = applyData;

  if (!window.__NOTIF_DATA__) {
    const p = new URLSearchParams(window.location.search);
    if (p.get('title')) {
      requestAnimationFrame(() => applyData({
        title:    p.get('title')    || 'Seven',
        subtitle: p.get('subtitle') || '',
        detail:   p.get('detail')   || '',
        holdMs:   parseInt(p.get('holdMs') || '4500'),
      }));
    }
  }

  function retract() {
    if (_timer) { clearTimeout(_timer); _timer = null; }
    const card = document.getElementById('card');
    if (card.classList.contains('hiding')) return;
    card.classList.remove('show');
    card.classList.add('hiding');
    setTimeout(() => {
      if (window.electronAPI && window.electronAPI.close) {
        window.electronAPI.close();
      }
    }, 380);
  }
</script>
</body>
</html>
