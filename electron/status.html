<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VII</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

    html, body {
      width: 420px;
      height: 80px;
      background: transparent !important;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    :root {
      --panel-opacity: 0.78;
    }

    /* ── Conversation panel ── */
    #conv-panel {
      flex: 1;
      height: 72px;
      margin-right: 10px;
      border-radius: 14px;
      opacity: 0;
      transform: translateX(16px);
      transition:
        opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      overflow: hidden;
      background: rgba(8, 8, 12, var(--panel-opacity));
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow:
        0 16px 48px rgba(0,0,0,0.6),
        0 2px 8px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.03);
    }

    #conv-panel.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    #conv-panel.hiding {
      opacity: 0;
      transform: translateX(16px);
      pointer-events: none;
    }

    #conv-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scroll-behavior: smooth;
    }

    #conv-scroll::-webkit-scrollbar { width: 2px; }
    #conv-scroll::-webkit-scrollbar-track { background: transparent; }
    #conv-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
    }

    .hist-user {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      flex-shrink: 0;
    }

    .hist-user-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      flex-shrink: 0;
      width: 20px;
      padding-top: 1px;
    }

    .hist-user-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      font-weight: 400;
      line-height: 1.4;
      flex: 1;
    }

    .hist-seven {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      flex-shrink: 0;
    }

    .hist-seven-label {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(99,102,241,0.4);
      flex-shrink: 0;
      width: 20px;
      padding-top: 1px;
    }

    .hist-seven-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.72);
      font-weight: 300;
      line-height: 1.55;
      letter-spacing: 0.01em;
      flex: 1;
    }

    .hist-sep {
      height: 1px;
      background: linear-gradient(
        90deg, transparent,
        rgba(255,255,255,0.03) 40%,
        transparent
      );
      flex-shrink: 0;
      margin: 1px 0;
    }

    #live-seven-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      font-weight: 300;
      line-height: 1.55;
      letter-spacing: 0.01em;
      flex: 1;
    }

    #thinking {
      display: none;
      align-items: center;
      gap: 3px;
      padding: 3px 0;
    }
    #thinking span {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(168,85,247,0.6);
      display: inline-block;
    }
    #thinking span:nth-child(1) { animation: tBounce 1.2s ease-in-out 0.0s infinite; }
    #thinking span:nth-child(2) { animation: tBounce 1.2s ease-in-out 0.15s infinite; }
    #thinking span:nth-child(3) { animation: tBounce 1.2s ease-in-out 0.30s infinite; }

    .cursor-blink {
      display: inline-block;
      width: 1.5px; height: 11px;
      background: rgba(99,102,241,0.7);
      margin-left: 2px;
      vertical-align: middle;
      border-radius: 1px;
      animation: cursorBlink 0.9s ease-in-out infinite;
    }

    /* ── Orb container ── */
    #orb-container {
      width: 80px; height: 80px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer ambient glow layer */
    #orb-ambient {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 70px; height: 70px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease, background 0.8s ease;
      filter: blur(14px);
    }

    /* Ghost ring — outer pulse */
    #ghost-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 1px solid transparent;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: border-color 0.7s ease, opacity 0.7s ease;
    }

    /* Pulse ring — inner ring around orb */
    #pulse-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 1px solid transparent;
      pointer-events: none;
      z-index: 2;
      transition: border-color 0.7s ease;
    }

    /* Main orb body */
    #orb {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at 38% 32%,
        rgba(24, 24, 36, 0.95) 0%,
        rgba(10, 10, 18, 0.98) 60%,
        rgba(5, 5, 10, 1) 100%
      );
      border: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
      transition:
        border-color 0.7s cubic-bezier(0.4,0,0.2,1),
        background   0.7s cubic-bezier(0.4,0,0.2,1),
        box-shadow   0.7s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.4);
    }

    /* Specular highlight */
    #orb::before {
      content: '';
      position: absolute;
      top: 6px; left: 9px;
      width: 14px; height: 6px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse,
        rgba(255,255,255,0.09) 0%,
        transparent 100%
      );
      z-index: 5;
      pointer-events: none;
    }

    #orb-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.14);
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 4;
      transition:
        color      0.7s cubic-bezier(0.4,0,0.2,1),
        text-shadow 0.7s ease;
    }

    #interaction-layer {
      position: absolute;
      top: 0; left: 0;
      width: 80px; height: 80px;
      z-index: 10;
      cursor: grab;
      border-radius: 50%;
    }
    #interaction-layer:active { cursor: grabbing; }

    #tooltip {
      position: fixed;
      top: -24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,16,0.95);
      color: rgba(255,255,255,0.35);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.05);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 100;
    }
    #orb-container:hover #tooltip { opacity: 1; }

    /* ══════════════════════════════════════
       STATE CLASSES
       Orb body stays dark always.
       Only glow rings and ambient carry color.
    ══════════════════════════════════════ */

    /* Shared orb body — never changes color */
    #orb {
      border-color: rgba(255,255,255,0.05);
      background: radial-gradient(
        ellipse at 38% 32%,
        rgba(26, 26, 38, 0.97) 0%,
        rgba(11, 11, 18, 0.99) 55%,
        rgba(5, 5, 10, 1) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.055),
        inset 0 -1px 0 rgba(0,0,0,0.55),
        0 2px 12px rgba(0,0,0,0.5);
    }

    /* IDLE */
    .idle #orb-text   { color: rgba(255,255,255,0.14); text-shadow: none; }
    .idle #orb-ambient { opacity: 0; }
    .idle #pulse-ring  { border-color: rgba(255,255,255,0.04); animation: none; }
    .idle #ghost-ring  { opacity: 0; animation: none; }

    /* LISTENING — green glow only outside */
    .listening #orb-text {
      color: rgba(255,255,255,0.22);
      text-shadow: none;
    }
    .listening #orb-ambient {
      opacity: 1;
      background: radial-gradient(
        circle,
        rgba(34,197,94,0.22) 0%,
        rgba(34,197,94,0.08) 45%,
        transparent 70%
      );
    }
    .listening #pulse-ring {
      border-color: rgba(34,197,94,0.32);
      border-width: 1px;
      animation: ringPulse 2.6s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .listening #ghost-ring {
      border-color: rgba(34,197,94,0.10);
      opacity: 1;
      animation: ringPulse 2.6s cubic-bezier(0.4,0,0.2,1) infinite 0.85s;
    }

    /* THINKING — violet glow only outside */
    .thinking #orb-text {
      color: rgba(255,255,255,0.22);
      text-shadow: none;
    }
    .thinking #orb-ambient {
      opacity: 1;
      background: radial-gradient(
        circle,
        rgba(168,85,247,0.24) 0%,
        rgba(168,85,247,0.08) 45%,
        transparent 70%
      );
    }
    .thinking #pulse-ring {
      border-color: rgba(168,85,247,0.30);
      border-width: 1px;
      animation: ringOrbit 3.5s linear infinite;
    }
    .thinking #ghost-ring {
      border-color: rgba(168,85,247,0.08);
      opacity: 1;
      animation: ringPulse 2s ease-in-out infinite 0.3s;
    }

    /* SPEAKING — indigo glow only outside */
    .speaking #orb-text {
      color: rgba(255,255,255,0.22);
      text-shadow: none;
    }
    .speaking #orb-ambient {
      opacity: 1;
      background: radial-gradient(
        circle,
        rgba(99,102,241,0.24) 0%,
        rgba(99,102,241,0.08) 45%,
        transparent 70%
      );
    }
    .speaking #pulse-ring {
      border-color: rgba(99,102,241,0.32);
      border-width: 1.5px;
      animation: ringBreathe 1.6s ease-in-out infinite;
    }
    .speaking #ghost-ring {
      border-color: rgba(99,102,241,0.10);
      opacity: 1;
      animation: ringBreathe 1.6s ease-in-out infinite 0.3s;
    }

    /* ── Animations ── */
    @keyframes ringPulse {
      0%   { transform: translate(-50%,-50%) scale(1);    opacity: 0.7; }
      70%  { transform: translate(-50%,-50%) scale(1.38); opacity: 0;   }
      100% { transform: translate(-50%,-50%) scale(1.38); opacity: 0;   }
    }
    @keyframes ringOrbit {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes ringBreathe {
      0%, 100% { transform: translate(-50%,-50%) scale(1);    opacity: 0.6; }
      50%      { transform: translate(-50%,-50%) scale(1.16); opacity: 0.2; }
    }
    @keyframes tBounce {
      0%,80%,100% { transform: scale(0.5); opacity: 0.3; }
      40%         { transform: scale(1);   opacity: 1;   }
    }
    @keyframes cursorBlink {
      0%,45%   { opacity: 1; }
      55%,100% { opacity: 0; }
    }
  </style>
</head>
<body class="idle">

  <div id="conv-panel">
    <div id="conv-scroll">
      <div id="live-user-row" class="hist-user" style="display:none">
        <span class="hist-user-label">You</span>
        <span id="live-user-text" class="hist-user-text"></span>
      </div>
      <div id="live-sep" class="hist-sep" style="display:none"></div>
      <div id="live-seven-row" class="hist-seven" style="display:none">
        <span id="live-seven-label" class="hist-seven-label">VII</span>
        <div style="flex:1;overflow:hidden">
          <div id="thinking"><span></span><span></span><span></span></div>
          <span id="live-seven-text" class="hist-seven-text"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="orb-container">
    <div id="orb-ambient"></div>
    <div id="ghost-ring"></div>
    <div id="pulse-ring"></div>
    <div id="orb"><span id="orb-text">VII</span></div>
    <div id="interaction-layer"></div>
    <div id="tooltip">Idle</div>
  </div>

  <script>
    const HIDE_DELAY_MS = 5000;
    const MAX_HISTORY   = 6;

    const body          = document.body;
    const convPanel     = document.getElementById('conv-panel');
    const convScroll    = document.getElementById('conv-scroll');
    const liveUserRow   = document.getElementById('live-user-row');
    const liveUserText  = document.getElementById('live-user-text');
    const liveSep       = document.getElementById('live-sep');
    const liveSevenRow  = document.getElementById('live-seven-row');
    const liveSevenText = document.getElementById('live-seven-text');
    const thinkingEl    = document.getElementById('thinking');
    const tooltip       = document.getElementById('tooltip');
    const iLayer        = document.getElementById('interaction-layer');

    let currentStatus = 'idle';
    let ws            = null;
    let reconnects    = 0;
    let hideTimer     = null;
    let panelVisible  = false;

    let lastUserText  = '';
    let lastSevenText = '';
    let wasActive     = false;
    let exchangeDone  = false;

    const history = [];

    const statusLabels = {
      idle: 'Idle', listening: 'Listening',
      thinking: 'Processing', speaking: 'Speaking',
    };

    // ── Panel show/hide ──
    function showPanel() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      convPanel.classList.remove('hiding');
      convPanel.classList.add('visible');
      panelVisible = true;
    }

    function hidePanel() {
      convPanel.classList.remove('visible');
      convPanel.classList.add('hiding');
      panelVisible = false;
    }

    function scheduleHide() {
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => { hidePanel(); hideTimer = null; }, HIDE_DELAY_MS);
    }

    function scrollToBottom() {
      convScroll.scrollTo({ top: convScroll.scrollHeight, behavior: 'smooth' });
    }

    // ── History ──
    function archiveCurrentExchange() {
      if (!lastUserText && !lastSevenText) return;
      history.push({ user: lastUserText, seven: lastSevenText });
      while (history.length > MAX_HISTORY) history.shift();
      renderHistory();
    }

    function renderHistory() {
      convScroll.querySelectorAll('.hist-entry').forEach(el => el.remove());
      const anchor = liveUserRow;
      history.forEach(entry => {
        const frag = document.createDocumentFragment();
        if (entry.user) {
          const uRow = document.createElement('div');
          uRow.className = 'hist-user hist-entry';
          uRow.style.opacity = '0.45';
          uRow.innerHTML = `<span class="hist-user-label">You</span><span class="hist-user-text">${entry.user}</span>`;
          frag.appendChild(uRow);
        }
        if (entry.seven) {
          const sRow = document.createElement('div');
          sRow.className = 'hist-seven hist-entry';
          sRow.style.opacity = '0.45';
          sRow.innerHTML = `<span class="hist-seven-label">VII</span><span class="hist-seven-text">${entry.seven}</span>`;
          frag.appendChild(sRow);
          const sep = document.createElement('div');
          sep.className = 'hist-sep hist-entry';
          frag.appendChild(sep);
        }
        convScroll.insertBefore(frag, anchor);
      });
      scrollToBottom();
    }

    // ── Conversation update ──
    function updateConversation(userText, sevenText, isThinking, isSpeaking) {
      const hasContent = userText || sevenText || isThinking;

      if (userText && userText !== lastUserText) {
        if (lastUserText || lastSevenText) {
          archiveCurrentExchange();
          lastUserText = ''; lastSevenText = '';
        }
        lastUserText = userText;
        exchangeDone = false;
        liveUserText.textContent   = userText;
        liveUserRow.style.display  = 'flex';
        liveSep.style.display      = 'block';
        liveSevenText.textContent  = '';
        liveSevenRow.style.display = 'none';
        thinkingEl.style.display   = 'none';
        showPanel();
        wasActive = true;
      }

      if (isThinking && !sevenText) {
        liveSevenRow.style.display = 'flex';
        thinkingEl.style.display   = 'flex';
        liveSevenText.textContent  = '';
        removeOldCursor();
        showPanel();
      }

      if (sevenText && sevenText !== lastSevenText) {
        lastSevenText = sevenText;
        thinkingEl.style.display   = 'none';
        liveSevenRow.style.display = 'flex';
        liveSevenText.textContent  = sevenText;
        removeOldCursor();
        if (isSpeaking) {
          const cur = document.createElement('span');
          cur.className = 'cursor-blink';
          cur.id = 'active-cursor';
          liveSevenText.appendChild(cur);
        }
        scrollToBottom();
        showPanel();
      }

      if (!isSpeaking) removeOldCursor();

      if (!isThinking && !isSpeaking && sevenText && !exchangeDone) {
        exchangeDone = true;
        scheduleHide();
      }

      // If nothing is happening and panel is visible, hide it
      if (!isThinking && !isSpeaking && !userText && !sevenText && panelVisible && !hideTimer) {
        scheduleHide();
      }
    }

    function removeOldCursor() {
      const old = document.getElementById('active-cursor');
      if (old) old.remove();
    }

    // ── Status ──
    function setStatus(s) {
      if (currentStatus === s) return;
      currentStatus = s;
      body.className = s;
      tooltip.textContent = statusLabels[s] || '';
    }

    // ── WebSocket ──
    function connect() {
      if (reconnects > 80) return;
      try {
        ws = new WebSocket('ws://127.0.0.1:7777/ws/status');
        ws.onopen    = () => { reconnects = 0; setStatus('idle'); };
        ws.onmessage = (e) => {
          try {
            const d = JSON.parse(e.data);
            let s = 'idle';
            if      (d.speaking)  s = 'speaking';
            else if (d.thinking)  s = 'thinking';
            else if (d.listening) s = 'listening';
            setStatus(s);
            updateConversation(
              d.user_text  || '',
              d.seven_text || '',
              !!d.thinking,
              !!d.speaking
            );
          } catch {}
        };
        ws.onclose = () => { ws = null; reconnects++; setTimeout(connect, 2000); };
        ws.onerror = () => ws && ws.close();
      } catch {
        reconnects++;
        setTimeout(connect, 2000);
      }
    }

    // ── Drag and click ──
    let isDown = false, startX = 0, startY = 0, dragged = false;
    const THRESH = 5;

    iLayer.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDown = true; dragged = false;
      startX = e.screenX; startY = e.screenY;
      window.orbAPI?.dragStart(e.screenX, e.screenY);
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      if (Math.abs(e.screenX - startX) > THRESH || Math.abs(e.screenY - startY) > THRESH)
        dragged = true;
      window.orbAPI?.dragMove(e.screenX, e.screenY);
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDown) return;
      isDown = false;
      if (e.button === 0 && !dragged) window.orbAPI?.toggleDashboard();
    });

    iLayer.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.orbAPI?.showMenu();
    });

    // ── Click-through ──
    document.addEventListener('mousemove', (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const onOrb   = el && (el.id === 'interaction-layer' || el.closest('#orb-container'));
      const onPanel = el && (el === convPanel || convPanel.contains(el));

      // Enable interaction when hovering orb or panel; disable when outside
      if (onOrb || onPanel) {
        window.orbAPI?.setIgnoreMouseEvents(false);
      } else {
        window.orbAPI?.setIgnoreMouseEvents(true, { forward: true });
      }
    });

    document.addEventListener('mouseleave', () => {
      window.orbAPI?.setIgnoreMouseEvents(true);
    });

    // ── Opacity sync from Settings ──
    function applyOpacity(val) {
      const v = parseFloat(val);
      if (!isNaN(v) && v >= 0.1 && v <= 1.0) {
        document.documentElement.style.setProperty('--panel-opacity', String(v));
      }
    }

    // Load saved opacity on startup
    try {
      const saved = localStorage.getItem('seven_panel_opacity');
      if (saved) applyOpacity(saved);
    } catch {}

    // Poll for changes every 500ms
    let _lastOpacityTs = '';
    setInterval(() => {
      try {
        const ts = localStorage.getItem('seven_panel_opacity_ts') || '';
        if (ts && ts !== _lastOpacityTs) {
          _lastOpacityTs = ts;
          applyOpacity(localStorage.getItem('seven_panel_opacity') || '0.78');
        }
      } catch {}
    }, 500);

    // ── Start ──
    setStatus('idle');
    setTimeout(connect, 1200);
  </script>
</body>
</html>
