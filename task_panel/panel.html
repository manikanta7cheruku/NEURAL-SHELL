<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seven Tasks</title>
<link rel="stylesheet" href="styles/panel.css" />
</head>
<body>

<div id="panel">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-left">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="seven-dot dead" id="seven-dot" title="Seven status"></div>
        <span class="header-title">Tasks</span>
      </div>
      <span class="header-sub" id="header-sub">loading...</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleSearch()" title="Search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="closePanel()" title="Close (Esc)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat-box">
      <span class="stat-label">Pending</span>
      <span class="stat-val" id="stat-pending">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Today</span>
      <span class="stat-val dim" id="stat-today">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Overdue</span>
      <span class="stat-val dim" id="stat-overdue">0</span>
    </div>
  </div>

  <!-- Quick Add -->
  <div class="quick-add">
    <input class="quick-add-input" id="quick-input"
           placeholder="Quick add task... (Enter to save)"
           autocomplete="off" spellcheck="false" />
  </div>

  <!-- Search -->
  <div class="search-wrap" id="search-wrap">
    <input class="search-input" id="search-input"
           placeholder="Search tasks..." autocomplete="off" />
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">
      All <span class="filter-count" id="cnt-all">0</span>
    </button>
    <button class="filter-tab" data-filter="today" onclick="setFilter('today')">
      Today <span class="filter-count" id="cnt-today">0</span>
    </button>
    <button class="filter-tab" data-filter="overdue" onclick="setFilter('overdue')">
      Overdue <span class="filter-count" id="cnt-overdue">0</span>
    </button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading"><div class="spinner"></div></div>

  <!-- Task list -->
  <div class="task-list" id="task-list" style="display:none"></div>

  <!-- Empty state -->
  <div class="empty-state" id="empty" style="display:none">
    <div class="empty-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <span class="empty-title">All clear</span>
    <span class="empty-sub">No pending tasks. Type above to add one.</span>
  </div>

  <!-- Schedules section -->
  <div id="sched-section" style="display:none">
    <div class="section-divider">
      <span class="section-title">Upcoming Schedules</span>
    </div>
    <div class="sched-list" id="sched-list"></div>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <button class="footer-btn" onclick="openSevenTasks()">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
        <path d="M15 3h6v6"/><path d="M10 14L21 3"/>
      </svg>
      Open Seven
    </button>
    <button class="footer-btn danger" id="close-all-btn" onclick="closeAllWindows_click()">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
      Close All
    </button>
    <span class="footer-hint">Alt+Shift+T</span>
  </div>

</div>

<script src="scripts/panel_api.js"></script>
<script src="scripts/panel_tasks.js"></script>
<script src="scripts/panel_app.js"></script>
</body>
</html>
